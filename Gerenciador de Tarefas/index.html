
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <h2>Cadastrar tarefa</h2>

    <form id="formulario">
        <input type="text" id="descricao" placeholder="Descrição da tarefa" required>

        <select id="tipo" required>
            <option value="">Selecione o tipo</option>
            <option value="pendente">Pendente</option>
            <option value="andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Total de tarefas: <span id="contador">0</span></h2>

    <div class="container">

        <section class="pendente">
            <h2>Tarefas Pendentes</h2>
            <ul id="lista-pendente"></ul>
        </section>

        <section class="andamento">
            <h2>Tarefas Em Andamento</h2>
            <ul id="lista-andamento"></ul>
        </section>

        <section class="concluida">
            <h2>Tarefas Concluídas</h2>
            <ul id="lista-concluida"></ul>
        </section>

    </div>

    <h2>Excluir tarefa</h2>

    <p>Para excluir uma tarefa, informe o código dela no formulário abaixo.</p>

    <form id="formulario-excluir">
        <input type="number" id="codigo" placeholder="Código da tarefa" required>
        <button type="submit">Excluir</button>
    </form>

    <script src="script.js"></script>

</body>
</html>
